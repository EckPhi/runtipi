name: Development Release

on:
  push:
    tags:
      - "develop-*"

permissions:
  contents: read

concurrency:
  group: development-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          build-args: |
            TIPI_VERSION=${{ github.ref_name }}
            LOCAL=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=development-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=development-${{ matrix.arch }}

  publish:
    name: Publish development release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          cat > /tmp/release-notes.md <<NOTES
          Development build for server testing.

          Image: \`$IMAGE:$VERSION\`
          Platforms: Linux AMD64 and ARM64.
          Source: $GITHUB_SHA

          Includes the Plugins area, System Insights, and App Health.
          Use this pinned image for the Runtipi service in your server's
          Docker Compose configuration, then pull and recreate that service.
          Keep the previous image tag for rollback.

          This release contains the Runtipi server image. It does not replace
          the Runtipi CLI or publish to the upstream update channel.
          NOTES
          gh release create "$VERSION" --verify-tag --prerelease --latest=false \
            --title "$VERSION" --notes-file /tmp/release-notes.md
